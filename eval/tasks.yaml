# Evaluation Task Set
# 25 tasks across 2 complexity levels
#
# Level 1: General Kubernetes operations
# Level 2: ML inference service operations (thesis differentiator)

tasks:

  # ── Level 1: General Kubernetes ──────────────────────────────────────────

  - id: L1-01
    level: 1
    category: general_k8s
    description: List all running pods
    prompt: "Show me all pods running in the cluster"
    success_criteria:
      response_keywords: ["pod", "running", "kube-system"]
      cluster_check: null
    setup_commands: []
    cleanup_commands: []

  - id: L1-02
    level: 1
    category: general_k8s
    description: Describe a specific pod
    prompt: "Describe the coredns pod in kube-system namespace"
    success_criteria:
      response_keywords: ["coredns", "kube-system", "running"]
      cluster_check: null
    setup_commands: []
    cleanup_commands: []

  - id: L1-03
    level: 1
    category: general_k8s
    description: Check node resource usage
    prompt: "Show me the resource usage of all nodes"
    success_criteria:
      response_keywords: ["cpu", "memory", "node"]
      cluster_check: null
    setup_commands: []
    cleanup_commands: []

  - id: L1-04
    level: 1
    category: general_k8s
    description: Get all namespaces
    prompt: "List all namespaces in the cluster"
    success_criteria:
      response_keywords: ["default", "kube-system", "namespace"]
      cluster_check: null
    setup_commands: []
    cleanup_commands: []

  - id: L1-05
    level: 1
    category: general_k8s
    description: Create a deployment with 2 replicas
    prompt: "Create a deployment called eval-nginx with image nginx and 2 replicas"
    success_criteria:
      response_keywords: ["nginx", "created", "deploy"]
      cluster_check:
        command: "kubectl get deployment eval-nginx -o jsonpath='{.spec.replicas}'"
        expected: "2"
    setup_commands: []
    cleanup_commands:
      - "kubectl delete deployment eval-nginx --ignore-not-found"

  - id: L1-06
    level: 1
    category: general_k8s
    description: Delete a deployment
    prompt: "Delete the deployment called eval-delete-me"
    success_criteria:
      response_keywords: ["delet", "remov", "eval-delete-me"]
      cluster_check:
        command: "kubectl get deployment eval-delete-me --ignore-not-found"
        expected: ""
    setup_commands:
      - "kubectl create deployment eval-delete-me --image=nginx"
      - "sleep 3"
    cleanup_commands:
      - "kubectl delete deployment eval-delete-me --ignore-not-found"

  - id: L1-07
    level: 1
    category: general_k8s
    description: Check cluster health
    prompt: "Check the overall health of the cluster — nodes and pods"
    success_criteria:
      response_keywords: ["running", "node", "pod", "ready"]
      cluster_check: null
    setup_commands: []
    cleanup_commands: []

  - id: L1-08
    level: 1
    category: general_k8s
    description: Get pod logs
    prompt: "Show me the logs of the coredns pod in kube-system"
    success_criteria:
      response_keywords: ["coredns", "log", "dns"]
      cluster_check: null
    setup_commands: []
    cleanup_commands: []

  - id: L1-09
    level: 1
    category: general_k8s
    description: Scale a deployment to 3 replicas
    prompt: "Scale the eval-scale deployment to 3 replicas"
    success_criteria:
      response_keywords: ["scale", "3", "replica"]
      cluster_check:
        command: "kubectl get deployment eval-scale -o jsonpath='{.spec.replicas}'"
        expected: "3"
    setup_commands:
      - "kubectl create deployment eval-scale --image=nginx"
      - "sleep 3"
    cleanup_commands:
      - "kubectl delete deployment eval-scale --ignore-not-found"

  - id: L1-10
    level: 1
    category: general_k8s
    description: General greeting
    prompt: "Hello, who are you and what can you help me with?"
    success_criteria:
      response_keywords: ["assist", "help", "kubernetes"]
      cluster_check: null
    setup_commands: []
    cleanup_commands: []

  # ── Level 2: ML Inference Service Operations ──────────────────────────────

  - id: L2-01
    level: 2
    category: ml_specific
    description: Deploy ML service from manifest
    prompt: "Deploy the ML inference service using the manifest at k8s/ml_service/deployment.yaml"
    success_criteria:
      response_keywords: ["ml-service", "deploy", "applied", "created", "running"]
      cluster_check:
        command: "kubectl get deployment ml-service -o jsonpath='{.status.availableReplicas}'"
        expected: "1"
    setup_commands:
      - "kubectl delete deployment ml-service --ignore-not-found"
      - "kubectl delete service ml-service --ignore-not-found"
      - "sleep 3"
    cleanup_commands: []

  - id: L2-02
    level: 2
    category: ml_specific
    description: Check ML service health endpoint
    prompt: "Check if the ML service is healthy by calling its health endpoint at http://localhost:30081/health"
    success_criteria:
      response_keywords: ["healthy", "health", "status", "model"]
      cluster_check: null
    setup_commands:
      - "kubectl apply -f k8s/ml_service/deployment.yaml"
      - "sleep 10"
    cleanup_commands: []

  - id: L2-03
    level: 2
    category: ml_specific
    description: Send prediction request to ML service
    prompt: "POST a prediction request to http://localhost:30081/predict with an empty JSON payload {}"
    success_criteria:
      response_keywords: ["prediction", "confidence", "predict", "class"]
      cluster_check: null
    setup_commands:
      - "kubectl apply -f k8s/ml_service/deployment.yaml"
      - "sleep 10"
    cleanup_commands: []

  - id: L2-04
    level: 2
    category: ml_specific
    description: Update model version v1 to v2
    prompt: "Update the ML service model to version v2"
    success_criteria:
      response_keywords: ["v2", "update", "version", "rollout", "image"]
      cluster_check:
        command: "kubectl get deployment ml-service -o jsonpath='{.spec.template.spec.containers[0].image}'"
        expected: "v2"
    setup_commands:
      - "kubectl apply -f k8s/ml_service/deployment.yaml"
      - "sleep 8"
    cleanup_commands:
      - "kubectl set image deployment/ml-service ml-service=ml-service:v1"

  - id: L2-05
    level: 2
    category: ml_specific
    description: Query inference request count via Prometheus
    prompt: "Query Prometheus for the total number of ML inference requests using ml_requests_total"
    success_criteria:
      response_keywords: ["ml_requests_total", "metric", "request", "prometheus"]
      cluster_check: null
    setup_commands:
      - "kubectl apply -f k8s/ml_service/deployment.yaml"
      - "sleep 8"
    cleanup_commands: []

  - id: L2-06
    level: 2
    category: ml_specific
    description: Query P95 inference latency
    prompt: "What is the P95 inference latency of the ML service?"
    success_criteria:
      response_keywords: ["latency", "p95", "percentile", "seconds", "histogram"]
      cluster_check: null
    setup_commands:
      - "kubectl apply -f k8s/ml_service/deployment.yaml"
      - "sleep 8"
    cleanup_commands: []

  - id: L2-07
    level: 2
    category: ml_specific
    description: Scale ML service for high traffic
    prompt: "The ML service is experiencing high traffic, scale it to 3 replicas"
    success_criteria:
      response_keywords: ["scale", "3", "replica", "ml-service"]
      cluster_check:
        command: "kubectl get deployment ml-service -o jsonpath='{.spec.replicas}'"
        expected: "3"
    setup_commands:
      - "kubectl apply -f k8s/ml_service/deployment.yaml"
      - "sleep 8"
    cleanup_commands:
      - "kubectl scale deployment ml-service --replicas=1"

  - id: L2-08
    level: 2
    category: ml_specific
    description: Check current model version deployed
    prompt: "What model version is currently deployed for the ML service?"
    success_criteria:
      response_keywords: ["v1", "v2", "version", "image", "ml-service"]
      cluster_check:
        command: "kubectl get deployment ml-service -o jsonpath='{.spec.template.spec.containers[0].image}'"
        in_response: true
    setup_commands:
      - "kubectl apply -f k8s/ml_service/deployment.yaml"
      - "sleep 8"
    cleanup_commands: []

  - id: L2-09
    level: 2
    category: ml_specific
    description: Scrape raw Prometheus metrics from service
    prompt: "Scrape the raw metrics from the ML service at http://localhost:30081/metrics"
    success_criteria:
      response_keywords: ["ml_requests_total", "ml_request_latency", "metric"]
      cluster_check: null
    setup_commands:
      - "kubectl apply -f k8s/ml_service/deployment.yaml"
      - "sleep 8"
    cleanup_commands: []

  - id: L2-10
    level: 2
    category: ml_specific
    description: Rollback model from v2 to v1
    prompt: "Rollback the ML service model from v2 back to v1"
    success_criteria:
      response_keywords: ["v1", "rollback", "version", "update", "image"]
      cluster_check:
        command: "kubectl get deployment ml-service -o jsonpath='{.spec.template.spec.containers[0].image}'"
        expected: "v1"
    setup_commands:
      - "kubectl apply -f k8s/ml_service/deployment.yaml"
      - "kubectl set image deployment/ml-service ml-service=ml-service:v2"
      - "sleep 8"
    cleanup_commands: []

  - id: L2-11
    level: 2
    category: ml_specific
    description: Diagnose deployment with bad image
    prompt: "There seems to be a problem with the eval-crasher deployment, can you diagnose what is wrong?"
    success_criteria:
      response_keywords: ["error", "image", "pull", "imagepull", "nonexistent", "backoff"]
      cluster_check:
        command: "kubectl get deployment eval-crasher -o jsonpath='{.spec.template.spec.containers[0].image}'"
        in_response: true
    setup_commands:
      - "kubectl create deployment eval-crasher --image=nonexistent-image:latest"
      - "sleep 8"
    cleanup_commands:
      - "kubectl delete deployment eval-crasher --ignore-not-found"

  - id: L2-12
    level: 2
    category: ml_specific
    description: Investigate high latency and recommend action
    prompt: "The ML service latency is very high and users are complaining. Investigate the metrics and take action to fix it."
    success_criteria:
      response_keywords: ["latency", "scale", "replica", "performance"]
      cluster_check: null
    setup_commands:
      - "kubectl apply -f k8s/ml_service/deployment.yaml"
      - "sleep 8"
    cleanup_commands:
      - "kubectl scale deployment ml-service --replicas=1"

  - id: L2-13
    level: 2
    category: ml_specific
    description: Check pod status after restart
    prompt: "The ML service may have had an issue. Check the current pod status and report what you find."
    success_criteria:
      response_keywords: ["pod", "ml-service", "running", "status", "ready"]
      cluster_check: null
    setup_commands:
      - "kubectl apply -f k8s/ml_service/deployment.yaml"
      - "sleep 8"
      - "kubectl delete pod -l app=ml-service --ignore-not-found"
      - "sleep 3"
    cleanup_commands: []

  - id: L2-14
    level: 2
    category: general_k8s
    description: Generate and deploy a new service from scratch
    prompt: "Deploy a Redis cache service with 1 replica on port 6379 in the default namespace"
    success_criteria:
      response_keywords: ["redis", "deploy", "applied", "created", "6379"]
      cluster_check:
        command: "kubectl get deployment -o name"
        expected: "redis"
    setup_commands: []
    cleanup_commands:
      - "kubectl delete deployment -l app=redis --ignore-not-found"
      - "kubectl delete service -l app=redis --ignore-not-found"

  - id: L2-15
    level: 2
    category: ml_specific
    description: Multi-step deploy, health check, version update
    prompt: "Deploy the ML service from k8s/ml_service/deployment.yaml, verify it is healthy, then update it to model version v2"
    success_criteria:
      response_keywords: ["ml-service", "healthy", "v2", "deploy", "version"]
      cluster_check:
        command: "kubectl get deployment ml-service -o jsonpath='{.spec.template.spec.containers[0].image}'"
        expected: "v2"
    setup_commands:
      - "kubectl delete deployment ml-service --ignore-not-found"
      - "kubectl delete service ml-service --ignore-not-found"
      - "sleep 3"
    cleanup_commands: []
