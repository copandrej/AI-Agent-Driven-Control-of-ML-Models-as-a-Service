[project]
name = "agentic_kubernetes"
version = "0.1.0"
description = "AI-powered agent system for managing Kubernetes clusters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crewai>=1.11.1",
    "crewai-tools>=1.11.1",
    "python-dotenv>=1.0.0",
    "litellm<=1.75.3",
    "aiohttp>=3.13.2",
    "pyyaml>=6.0.0",
    "chromadb>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
