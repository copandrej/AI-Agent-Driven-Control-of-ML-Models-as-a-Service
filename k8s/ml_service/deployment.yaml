apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnist-service
  labels:
    app: mnist-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mnist-service
  template:
    metadata:
      labels:
        app: mnist-service
      annotations:
        # Prometheus scraping via ServiceMonitor (preferred) or pod annotations
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: mnist-service
        image: mnist-service:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: MODEL_VERSION
          value: "v1"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
          # GPU support (uncomment when GPU nodes are available):
          # limits:
          #   nvidia.com/gpu: "1"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
      # Architecture selector for heterogeneous clusters.
      # Change to "arm64" for ARM nodes.
      nodeSelector:
        kubernetes.io/arch: amd64
---
apiVersion: v1
kind: Service
metadata:
  name: mnist-service
  labels:
    app: mnist-service
spec:
  selector:
    app: mnist-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30081
  type: NodePort
