# ServiceMonitor for Prometheus Operator.
# Prometheus will automatically scrape /metrics from the ML service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ml-service-monitor
  namespace: default
  labels:
    app: ml-service
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: ml-service
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
