# Minimal kube-prometheus-stack values for Kind test cluster.
# Reduces resource requests and disables components not needed.

prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # Scrape all ServiceMonitors regardless of release labels
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 6h
    storageSpec: {}

grafana:
  service:
    type: NodePort
    nodePort: 30030
  adminPassword: admin
  # Read-only access without a token, so the grafana_alerts tool works on the local test cluster
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Disable alertmanager — not needed for thesis evaluation
alertmanager:
  enabled: false

# Disable components that don't work well on Kind
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
